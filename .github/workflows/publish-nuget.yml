name: Publish to NuGet

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Derive version from tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore CortexUSB.sln

      - name: Build
        run: dotnet build CortexUSB.sln --no-restore --configuration Release -p:Version=${{ env.PACKAGE_VERSION }}

      - name: Pack
        run: dotnet pack src/CortexUSB.csproj --no-build --configuration Release -p:Version=${{ env.PACKAGE_VERSION }} --output ./nupkg

      - name: Push to NuGet.org
        run: dotnet nuget push "./nupkg/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
