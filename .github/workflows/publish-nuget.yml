name: Publish to NuGet

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Generate version
        id: gen-version
        run: |
          ./tools/gen-version.sh
          echo "Version: ${{ steps.gen-version.outputs.version }} (${{ steps.gen-version.outputs.short_sha }})"

      - name: Restore
        run: dotnet restore CortexUSB.sln

      - name: Build
        run: dotnet build CortexUSB.sln --no-restore --configuration Release -p:Version=${{ steps.gen-version.outputs.version }} -p:InformationalVersion=${{ steps.gen-version.outputs.full_version }}

      - name: Pack
        run: dotnet pack src/CortexUSB.csproj --no-build --configuration Release -p:Version=${{ steps.gen-version.outputs.version }} -p:InformationalVersion=${{ steps.gen-version.outputs.full_version }} --output ./nupkg

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to NuGet.org
        run: dotnet nuget push "./nupkg/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create Tag
        uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{ steps.gen-version.outputs.version }}
          message: "Release ${{ steps.gen-version.outputs.full_version }}"
